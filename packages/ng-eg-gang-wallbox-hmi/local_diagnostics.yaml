# ==============================================================================
# LOCAL HMI DIAGNOSTICS
# ==============================================================================
#
# Adapted from the reference project's shared/local-diagnostics.yaml.
# Uses the debug component already configured by the root YAML. These sensors
# describe this HMI, not the wallbox, and do not participate in command gating.
# The local backup-battery voltage and state of charge come from the shared
# Waveshare base.
# ==============================================================================

sensor:
  - platform: debug
    free:
      id: debug_heap_free
      name: "Heap Free"
      entity_category: diagnostic
    block:
      id: debug_heap_max_block
      name: "Heap Max Block"
      entity_category: diagnostic
    psram:
      id: debug_free_psram
      name: "Free PSRAM"
      entity_category: diagnostic
    loop_time:
      id: debug_loop_time
      name: "Loop Time"
      entity_category: diagnostic
    cpu_frequency:
      id: debug_cpu_frequency
      name: "CPU Frequency"
      entity_category: diagnostic
  - platform: internal_temperature
    id: cpu_temp
    name: "HMI CPU Temperature"
    entity_category: diagnostic
    accuracy_decimals: 1
    update_interval: 10s
  - platform: uptime
    id: debug_uptime
    name: "HMI Uptime"
    type: seconds
    entity_category: diagnostic
    update_interval: 10s
  - platform: wifi_signal
    id: wifi_sig
    name: "HMI WiFi RSSI"
    entity_category: diagnostic
    update_interval: 10s

text_sensor:
  - platform: wifi_info
    ip_address:
      id: ip_address
      name: "HMI IP Address"
      entity_category: diagnostic
  - platform: version
    name: "ESPHome Version"
    entity_category: diagnostic
  - platform: debug
    reset_reason:
      id: hmi_reset_reason
      name: "HMI Reset Reason"
      entity_category: diagnostic
