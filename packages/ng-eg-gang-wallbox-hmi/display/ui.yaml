# ==============================================================================
# WALLBOX HMI LAYOUT
# ==============================================================================
#
# Pages, bottom navigation and the current-request confirmation dialog. Fonts,
# styles, the theme and the persistent header come from the shared Waveshare
# base; runtime updates are handled by runtime.yaml.
# ==============================================================================

lvgl:
  top_layer:
    widgets:
      - button: !include
          file: widgets/navigation.yaml
          vars: {id: nav_overview, page_id: page_overview, index: 0, title: Übersicht}
      - button: !include
          file: widgets/navigation.yaml
          vars: {id: nav_phases, page_id: page_phases, index: 1, title: Phasen}
      - button: !include
          file: widgets/navigation.yaml
          vars: {id: nav_trends, page_id: page_trends, index: 2, title: Trends}
      - button: !include
          file: widgets/navigation.yaml
          vars: {id: nav_control, page_id: page_control, index: 3, title: Ladestrom}
      - button: !include
          file: widgets/navigation.yaml
          vars: {id: nav_system, page_id: page_system, index: 4, title: System}

      # Confirmation blocks navigation and prevents accidental current changes.
      - obj:
          id: control_dialog
          hidden: true
          x: 0
          y: 0
          width: 800
          height: 480
          clickable: true
          scrollable: false
          styles: style_dialog_overlay
          widgets:
            - obj:
                align: CENTER
                width: 570
                height: 250
                scrollable: false
                styles: style_dialog_panel
                widgets:
                  - label:
                      id: confirm_text
                      x: 24
                      y: 24
                      width: 522
                      text_font: font_24
                      text: "Ladestrom ändern?"
                  - label:
                      x: 24
                      y: 86
                      width: 522
                      text: "Anfrage über Home Assistant.
0 A ist kein Not-Aus."
                      styles: style_title_label
                  - button:
                      x: 24
                      y: 170
                      width: 246
                      height: 54
                      styles: style_dialog_button
                      widgets:
                        - label:
                            align: CENTER
                            text: "Abbrechen"
                      on_click:
                        - lvgl.widget.hide: control_dialog
                  - button:
                      x: 294
                      y: 170
                      width: 246
                      height: 54
                      styles: style_dialog_button
                      widgets:
                        - label:
                            align: CENTER
                            text: "Bestätigen"
                      on_click:
                        - lvgl.widget.hide: control_dialog
                        - script.execute: request_current

  pages:
    - id: page_overview
      styles: style_page
      widgets:
        - obj:
            x: 12
            y: 70
            width: 304
            height: 204
            styles: style_card
            widgets:
              - label:
                  x: 20
                  y: 16
                  text: "LADELEISTUNG"
                  styles: style_title_label
              - label:
                  id: power_value
                  x: 20
                  y: 52
                  text: "-- kW"
                  text_font: font_48
                  text_color: 0x4DD9E8
              - label:
                  id: state_code
                  x: 20
                  y: 132
                  text: "Ladezustand: --"
                  text_font: font_24
              - label:
                  x: 20
                  y: 172
                  text: "Heidelberg · 11 kW"
                  styles: style_title_label
        - obj:
            x: 328
            y: 70
            width: 252
            height: 204
            styles: style_card
            widgets:
              - label:
                  x: 18
                  y: 16
                  text: "Geladene Energie"
                  styles: style_title_label
              - label:
                  id: energy_value
                  x: 18
                  y: 44
                  text: "-- kWh"
                  text_font: font_24
                  text_color: 0x68E0A0
              - label:
                  x: 18
                  y: 94
                  text: "PCB-Temp."
                  styles: style_title_label
              - label:
                  id: temperature_value
                  x: 142
                  y: 90
                  text: "-- °C"
                  text_font: font_24
              - label:
                  x: 18
                  y: 150
                  text: "Stromvorgabe"
                  styles: style_title_label
              - label:
                  id: current_limit_value
                  x: 142
                  y: 146
                  text: "-- A"
                  text_font: font_24
        - obj:
            x: 12
            y: 286
            width: 568
            height: 118
            styles: style_card
            widgets:
              - label:
                  x: 18
                  y: 12
                  text: "STATUS · HOME ASSISTANT"
                  styles: style_title_label
              - label:
                  id: state_description
                  x: 18
                  y: 42
                  width: 528
                  height: 64
                  long_mode: WRAP
                  text: "Warte auf aktuelle Wallbox-Daten …"
        - obj: !include widgets/battery_bank.yaml

    - id: page_phases
      styles: style_page
      widgets:
        - obj: !include
            file: widgets/phase.yaml
            vars: {phase: 1, x: 12, color: 0x4DD9E8}
        - obj: !include
            file: widgets/phase.yaml
            vars: {phase: 2, x: 274, color: 0x68E0A0}
        - obj: !include
            file: widgets/phase.yaml
            vars: {phase: 3, x: 536, color: 0xFFB65C}
        - label:
            x: 24
            y: 364
            width: 752
            text: "Effektivwerte je Phase · -- bedeutet: kein gültiger Messwert"
            styles: style_title_label

    - id: page_trends
      styles: style_page
      widgets:
        - button: !include
            file: widgets/trend_button.yaml
            vars: {id: trend_power, x: 12, selection: 0, title: Leistung}
        - button: !include
            file: widgets/trend_button.yaml
            vars: {id: trend_voltage, x: 209, selection: 1, title: Spannung}
        - button: !include
            file: widgets/trend_button.yaml
            vars: {id: trend_current, x: 406, selection: 2, title: Strom}
        - button: !include
            file: widgets/trend_button.yaml
            vars: {id: trend_temperature, x: 603, selection: 3, title: Temperatur}
        - obj:
            id: chart_host
            x: 12
            y: 124
            width: 776
            height: 242
            styles: style_card
            widgets:
              - label:
                  id: chart_title
                  x: 18
                  y: 8
                  text: "Leistung (kW)"
              - label:
                  id: chart_axis_top
                  x: 2
                  y: 34
                  width: 50
                  text_align: RIGHT
                  text: "12"
                  styles: style_title_label
              - label:
                  id: chart_axis_bottom
                  x: 2
                  y: 180
                  width: 50
                  text_align: RIGHT
                  text: "0"
                  styles: style_title_label
              - label:
                  x: 58
                  y: 210
                  text: "-60 min"
                  styles: style_title_label
              - label:
                  x: 366
                  y: 210
                  text: "-30 min"
                  styles: style_title_label
              - label:
                  x: 706
                  y: 210
                  text: "jetzt"
                  styles: style_title_label
        - label:
            id: chart_legend
            x: 24
            y: 377
            width: 750
            text: "Warte auf Messwerte – keine Historie vorhanden"
            styles: style_title_label

    - id: page_control
      styles: style_page
      widgets:
        - obj:
            x: 12
            y: 70
            width: 776
            height: 334
            styles: style_card
            widgets:
              - label:
                  x: 20
                  y: 16
                  text: "Maximalen Ladestrom anfordern"
                  text_font: font_24
              - label:
                  id: control_feedback
                  x: 20
                  y: 58
                  width: 730
                  text: "HA-Auswahl: --  |  Wallbox-Rückmeldung: -- A"
              - button: !include
                  file: widgets/current_button.yaml
                  vars: {id: current_0, x: 20, option: 0A, title: "0 A"}
              - button: !include
                  file: widgets/current_button.yaml
                  vars: {id: current_6, x: 168, option: 6A, title: "6 A"}
              - button: !include
                  file: widgets/current_button.yaml
                  vars: {id: current_10, x: 316, option: 10A, title: "10 A"}
              - button: !include
                  file: widgets/current_button.yaml
                  vars: {id: current_12, x: 464, option: 12A, title: "12 A"}
              - button: !include
                  file: widgets/current_button.yaml
                  vars: {id: current_16, x: 612, option: 16A, title: "16 A"}
              - label:
                  id: command_result
                  x: 20
                  y: 206
                  width: 730
                  height: 52
                  long_mode: WRAP
                  text: "Keine Anfrage gesendet."
                  text_color: 0xFFB65C
              - label:
                  x: 20
                  y: 274
                  width: 730
                  text: "HA-Automation setzt die Vorgabe um.\n0 A fordert eine Ladepause an; kein Not-Aus."
                  styles: style_title_label
    - !include pages/system.yaml
