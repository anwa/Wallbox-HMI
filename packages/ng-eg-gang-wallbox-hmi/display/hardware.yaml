# Same board model and delayed display initialization as the reference HMI.

# ==============================================================================
# LOCAL HMI BACKUP BATTERY
# ==============================================================================
#
# The 1S cell connects to J3. The onboard divider is:
# VBAT -> 200 kOhm -> TP1 -> 100 kOhm -> GND.
# Requires the external TP1 -> J8 pin 3 / AD (GPIO6) connection used by the
# reference project. Do not connect the battery voltage directly to GPIO6.
# This is a local diagnostic only, independent of HA and the solar battery bank.
# ==============================================================================

sensor:
  - platform: adc
    id: local_backup_battery_voltage
    name: "HMI Battery Voltage"
    pin: GPIO6
    attenuation: 6db
    update_interval: 5s
    unit_of_measurement: V
    device_class: voltage
    state_class: measurement
    entity_category: diagnostic
    accuracy_decimals: 2
    icon: mdi:battery
    filters:
      # Restore VBAT from the onboard 1:3 divider, then smooth five readings.
      - multiply: 3.0
      - sliding_window_moving_average:
          window_size: 5
          send_every: 1

i2c:
  - id: board_i2c
    sda: GPIO8
    scl: GPIO9
    frequency: 400kHz
    scan: true

ch422g:
  - id: io_expander
    i2c_id: board_i2c

touchscreen:
  - platform: gt911
    id: wallbox_touch
    display: wallbox_display
    i2c_id: board_i2c
    interrupt_pin: GPIO4
    reset_pin:
      ch422g: io_expander
      number: 1
      mode:
        output: true

display:
  - platform: mipi_rgb
    model: ESP32-S3-TOUCH-LCD-7-800X480
    id: wallbox_display
    # Reserve internal/DMA memory for networking before allocating the display.
    setup_priority: 190
    auto_clear_enabled: false
    update_interval: never

lvgl:
  id: wallbox_lvgl
  setup_priority: 180
  displays:
    - wallbox_display
  touchscreens:
    - touchscreen_id: wallbox_touch
  buffer_size: 30%
  color_depth: 16
  log_level: WARN
