# Aggregate, read-only battery bank card; no substitution variables required.
x: 592
y: 70
width: 196
height: 334
styles: style_card
widgets:
  - label:
      x: 10
      y: 10
      text: "BATTERY BANK"
      styles: style_title_label
  - label:
      id: battery_soc_value
      align: TOP_MID
      y: 53
      text: "-- %"
      text_font: font_32
  - label:
      x: 10
      y: 110
      text: "Leistung"
      text_font: font_14
      styles: style_title_label
  - label:
      id: battery_power_value
      x: 64
      y: 107
      width: 120
      text_align: RIGHT
      text: "-- kW"
  # Site power from Home Assistant, shown beside the bank power.
  - label:
      x: 10
      y: 142
      text: "PV-Leistung"
      text_font: font_14
      styles: style_title_label
  - label:
      id: pv_power_value
      x: 64
      y: 139
      width: 120
      text_align: RIGHT
      text: "-- kW"
  - label:
      x: 10
      y: 174
      text: "Ladegerät"
      text_font: font_14
      styles: style_title_label
  - label:
      id: external_charger_power_value
      x: 64
      y: 171
      width: 120
      text_align: RIGHT
      text: "-- kW"
  - label:
      x: 10
      y: 206
      text: "Spannung"
      text_font: font_14
      styles: style_title_label
  - label:
      id: battery_voltage_value
      x: 88
      y: 203
      width: 96
      text_align: RIGHT
      text: "-- V"
  - label:
      x: 10
      y: 238
      text: "Temperatur"
      text_font: font_14
      styles: style_title_label
  - label:
      id: battery_temperature_value
      x: 88
      y: 235
      width: 96
      text_align: RIGHT
      text: "-- °C"
  - label:
      id: battery_state_value
      align: TOP_MID
      y: 280
