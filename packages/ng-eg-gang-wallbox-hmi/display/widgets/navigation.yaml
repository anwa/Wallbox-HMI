# Bottom navigation button placed by the shared Waveshare navigation geometry.
# Required vars: id, title, page_id, index (0-based position).
id: ${id}
x: ${ ui_nav_x0 + index * ui_nav_step }
y: ${ui_nav_y}
styles: style_nav_button
widgets:
  - label:
      align: CENTER
      text: ${title}
on_click:
  - lvgl.page.show: ${page_id}
  - script.execute:
      id: select_page
      page: ${index}
