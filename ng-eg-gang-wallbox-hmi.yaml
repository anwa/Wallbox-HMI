# ==============================================================================
# NG|EG|GANG WALLBOX HMI
# ==============================================================================
#
# Touchscreen HMI for the Heidelberg Energy Control wallbox on a Waveshare
# ESP32-S3-Touch-LCD-7 (800x480, GT911, CH422G).
#
# Board, display, touch, backlight, LVGL, local backup battery, fonts, theme,
# header and navigation geometry come from the shared Waveshare base. This
# configuration adds network services, Home Assistant imports, pages and the
# current-request backend.
# ==============================================================================

substitutions:

  # ---------------------------------------------------------------------------
  # SHARED WAVESHARE BASE
  # ---------------------------------------------------------------------------
  #
  # waveshare_base_ref pins the base release. waveshare_base_package selects
  # the package entry file; scripts/use-local-base.ps1 of the base repository
  # generates a local alternative for development, selected with
  # `esphome -s waveshare_base_package <file>`.
  # ---------------------------------------------------------------------------

  waveshare_base_ref: v1.0.1-rc.1
  waveshare_base_package: packages/ng-eg-gang-wallbox-hmi/waveshare-base.yaml

  # ---------------------------------------------------------------------------
  # BASE PARAMETERS
  # ---------------------------------------------------------------------------

  ui_header_title: "Wallbox"
  ui_header_status_width: "130"
  ui_default_font: font_18
  ui_nav_count: "5"
  battery_entity_prefix: "HMI"

packages:
  project_version: !include packages/ng-eg-gang-wallbox-hmi/version.yaml
  waveshare_base: !include ${waveshare_base_package}
  local_diagnostics: !include packages/ng-eg-gang-wallbox-hmi/local_diagnostics.yaml
  homeassistant: !include packages/ng-eg-gang-wallbox-hmi/homeassistant.yaml
  battery_bank: !include packages/ng-eg-gang-wallbox-hmi/battery_bank.yaml
  display_ui: !include packages/ng-eg-gang-wallbox-hmi/display/ui.yaml
  display_runtime: !include packages/ng-eg-gang-wallbox-hmi/display/runtime.yaml
  display_system: !include packages/ng-eg-gang-wallbox-hmi/display/system.yaml

esphome:
  name: ng-eg-gang-wallbox-hmi
  friendly_name: NG|EG|Gang|Wallbox-HMI
  min_version: 2026.11.0
  project:
    name: wallbox.hmi
    version: "${firmware_version}"
  includes:
    - packages/ng-eg-gang-wallbox-hmi/wallbox_ui.h

# ==============================================================================
# LOGGING
# ==============================================================================
#
# Debug logging is enabled for firmware, hardware and runtime diagnostics.
# ==============================================================================

logger:
  level: DEBUG

# ==============================================================================
# LOCAL ESPHOME WEB SERVER
# ==============================================================================
#
# Provides direct browser access to the target's exposed entities and controls
# whenever local IP networking is available.
#
# All web assets are stored locally so the interface does not depend on
# internet access.
# ==============================================================================

web_server:
  version: 3
  port: 80

  # Keep all web UI assets on the ESP32 so the interface remains usable
  # without internet access, including during blackstart scenarios.
  local: true

  # Internal helper entities are implementation details and should not be
  # exposed through the browser UI.
  include_internal: false

  # Protect browser access to charger controls and diagnostics.
  auth:
    username: !secret web_server_username
    password: !secret web_server_password
    type: digest

  # Native ESPHome OTA is already configured separately. Do not expose
  # firmware upload through the normal web interface.
  ota: false

# ==============================================================================
# HOME ASSISTANT NATIVE API
# ==============================================================================
#
# Provides the encrypted native ESPHome integration for Home Assistant.
#
# Network loss must not cause either target to reboot automatically.
# ==============================================================================

api:
  id: native_api
  reboot_timeout: 0s
  encryption:
    key: !secret api_encryption_key
  on_client_disconnected:
    - if:
        condition:
          not:
            api.connected:
              state_subscription_only: true
        then:
          - script.execute: invalidate_ha_state

# ==============================================================================
# OVER-THE-AIR FIRMWARE UPDATE
# ==============================================================================
#
# Enables authenticated ESPHome OTA updates after the initial USB installation.
# ==============================================================================

ota:
  - platform: esphome
    encryption:

# ==============================================================================
# WI-FI
# ==============================================================================
#
# Wi-Fi credentials are provided through secrets.yaml.
#
# Power saving and automatic reboot on connection loss are disabled because
# both targets are permanently powered and should remain locally stable when
# infrastructure Wi-Fi is unavailable.
# ==============================================================================

wifi:
  id: hmi_wifi
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  reboot_timeout: 0s
  ap:
    ssid: NG|EG|Wallbox-H Fallback Hotspot
    password: !secret fallback_ap_password

# ==============================================================================
# FALLBACK CAPTIVE PORTAL
# ==============================================================================
#
# Works with the fallback access point above if the configured infrastructure
# Wi-Fi cannot be reached.
# ==============================================================================

captive_portal:

# ==============================================================================
# TIME SYNCHRONIZATION
# ==============================================================================
#
# SNTP provides Europe/Berlin local time for shared HMI presentation and other
# time-dependent target functions.
#
# Header rendering is handled by the device package's display/runtime.yaml.
# ==============================================================================

time:
  - platform: sntp
    id: sntp_time
    timezone: Europe/Berlin
    servers:
      - 0.de.pool.ntp.org
      - 1.de.pool.ntp.org
      - 2.de.pool.ntp.org

    on_time_sync:
      then:
        - lambda: |-
            auto now = id(sntp_time).now();

            ESP_LOGI(
              "time",
              "SNTP synchronized: %02d.%02d.%04d %02d:%02d:%02d",
              now.day_of_month,
              now.month,
              now.year,
              now.hour,
              now.minute,
              now.second
            );

# ==============================================================================
# ESPHOME DEBUG METRICS
# ==============================================================================
#
# Enables local runtime diagnostics independently of Home Assistant.
# ==============================================================================

debug:
  update_interval: 5s
